aid: reflexion-medical
name: RefleXion Medical
description: 'RefleXion Medical is a privately held therapeutic oncology company headquartered
  in Hayward, California, founded in 2009 by Sam Mazin and Akshay Nanduri around the
  biology-guided radiotherapy (BgRT) concept conceived at Stanford University in 2007.
  The company designs, manufactures and commercializes the RefleXion X1 radiotherapy
  platform and SCINTIX biology-guided radiotherapy, which uses onboard PET detectors
  to sense emissions from an injected radiopharmaceutical and autonomously direct external-beam
  radiotherapy delivery with sub-second latency. The RefleXion X1 received FDA clearance
  for SRS, SBRT and IMRT in 2020, and SCINTIX therapy was FDA cleared in February 2023
  for treating tumors in the lung or bone arising from primary and metastatic cancer.
  RefleXion has raised more than $500 million from investors including TPG''s The Rise
  Fund, KCK Group, PSP Investments, Sofinnova, Pfizer Ventures and Johnson & Johnson
  Innovation. RefleXion is a medical device manufacturer rather than a software vendor
  and publishes no public developer portal, API documentation, SDKs or machine-readable
  API contract.'
